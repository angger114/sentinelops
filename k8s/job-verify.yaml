# Post-remediation verification Job: re-scans the target and confirms the fix stuck.
apiVersion: batch/v1
kind: Job
metadata:
  name: sentinel-verify-${FINDING_ID}
  namespace: sentinel
  labels: { app.kubernetes.io/name: sentinel-verify }
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: sentinel-scanner
      restartPolicy: Never
      containers:
        - name: verify
          image: ${IMAGE}
          command: ["/bin/sh", "-c"]
          args:
            - MODE=verify /entrypoint.sh
          env:
            - { name: FINDING_ID, value: "${FINDING_ID}" }
            - { name: TARGET_BUCKET, value: "${TARGET_BUCKET}" }
            - { name: ARTIFACTS_BUCKET, value: "${ARTIFACTS_BUCKET}" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
