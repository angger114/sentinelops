# Least-privilege in-cluster RBAC for the scanner SA: it only needs to read its own
# ConfigMap (the Rego policy) and report Job/Pod status within the sentinel namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinel-scanner-role
  namespace: sentinel
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinel-scanner-binding
  namespace: sentinel
subjects:
  - kind: ServiceAccount
    name: sentinel-scanner
    namespace: sentinel
roleRef:
  kind: Role
  name: sentinel-scanner-role
  apiGroup: rbac.authorization.k8s.io
