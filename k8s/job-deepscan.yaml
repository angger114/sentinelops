# Deep compliance scan Job. You can apply this manually to test:
#   FINDING_ID=SEC-DEMO0001 SCAN_BUCKET=... ARTIFACTS_BUCKET=... IMAGE=... envsubst < job-deepscan.yaml | kubectl apply -f -
# In production Step Functions launches an equivalent Job via eks:runJob.sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: sentinel-deepscan-${FINDING_ID}
  namespace: sentinel
  labels: { app.kubernetes.io/name: sentinel-deepscan }
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app.kubernetes.io/name: sentinel-deepscan }
    spec:
      serviceAccountName: sentinel-scanner
      restartPolicy: Never
      volumes:
        - name: work
          emptyDir: {}
        - name: policy
          configMap: { name: sentinel-policy }
      initContainers:
        - name: fetch-inventory
          image: amazon/aws-cli:2.15.30
          command: ["/bin/sh", "-c"]
          args:
            - aws s3 cp s3://$(SCAN_BUCKET)/inventory/$(FINDING_ID).json /work/inventory.json
          env:
            - { name: SCAN_BUCKET, value: "${SCAN_BUCKET}" }
            - { name: FINDING_ID, value: "${FINDING_ID}" }
          volumeMounts:
            - { name: work, mountPath: /work }
      containers:
        - name: scanner
          image: ${IMAGE}
          command: ["/bin/sh", "/entrypoint.sh"]
          env:
            - { name: FINDING_ID, value: "${FINDING_ID}" }
            - { name: ARTIFACTS_BUCKET, value: "${ARTIFACTS_BUCKET}" }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: policy, mountPath: /policy, readOnly: true }
