name: sentinelops-cicd
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  PREFIX: sentinel
  ARTIFACTS_BUCKET: sentinel-artifacts-angger26
  STACK: sentinelops-infra

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-dev.txt || true
      - run: echo "deps ok"

  test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Unit tests + ASL/JSON validation
        run: |
          python -m pip install pytest boto3
          python -c "import json,glob; [json.load(open(f)) for f in glob.glob('solution/asl/*.json')]; print('ASL valid')"
          pytest -q || echo "no tests yet"

  security_scan:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cfn-lint + bandit
        run: |
          pip install cfn-lint bandit
          cfn-lint solution/cloudformation/*.yaml
          bandit -r src -ll || true

  package:
    needs: [test, security_scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Package + upload Lambda artifacts
        run: ARTIFACTS_BUCKET=${{ env.ARTIFACTS_BUCKET }} ./scripts/package.sh

  deploy:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy CloudFormation (infra, minus Step Functions)
        run: |
          aws cloudformation deploy \
            --stack-name ${{ env.STACK }} \
            --template-file solution/cloudformation/sentinelops-infra.yaml \
            --parameter-overrides ArtifactsBucketName=${{ env.ARTIFACTS_BUCKET }} \
            --capabilities CAPABILITY_NAMED_IAM
      - name: Update remediate code + start CodeDeploy Blue/Green
        run: |
          aws lambda update-function-code \
            --function-name ${PREFIX}-fn-remediate \
            --s3-bucket ${{ env.ARTIFACTS_BUCKET }} --s3-key functions/remediate.zip --publish
          NEW=$(aws lambda list-versions-by-function --function-name ${PREFIX}-fn-remediate \
                --query 'Versions[-1].Version' --output text)
          CUR=$(aws lambda get-alias --function-name ${PREFIX}-fn-remediate --name live \
                --query FunctionVersion --output text)
          sed -e "s/CURRENT_VERSION/$CUR/" -e "s/TARGET_VERSION/$NEW/" \
            appspec/appspec-remediate.yaml > /tmp/appspec.yaml
          aws deploy create-deployment \
            --application-name ${PREFIX}-codedeploy-app \
            --deployment-group-name ${PREFIX}-dg-remediate \
            --revision "revisionType=AppSpecContent,appSpecContent={content='$(cat /tmp/appspec.yaml)'}" || true

  verification:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Start an end-to-end orchestrator execution
        run: |
          SM=$(aws ssm get-parameter --name /sentinel/stepfunctions/orchestrator_arn \
               --query Parameter.Value --output text)
          aws stepfunctions start-execution --state-machine-arn "$SM" \
            --input file://events/sample-finding.json
