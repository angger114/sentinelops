<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SentinelOps - Compliance Dashboard</title>
<style>
  body{font-family:system-ui,Segoe UI,Arial,sans-serif;margin:0;background:#0f1720;color:#e6edf3}
  header{padding:18px 24px;background:#1F3A5F}
  h1{margin:0;font-size:20px}
  main{padding:24px;max-width:1000px;margin:0 auto}
  .bar{display:flex;gap:12px;margin-bottom:16px}
  input{flex:1;padding:8px 10px;border-radius:6px;border:1px solid #30363d;background:#161b22;color:#e6edf3}
  button{padding:8px 14px;border:0;border-radius:6px;background:#0B6E4F;color:#fff;cursor:pointer}
  table{width:100%;border-collapse:collapse;background:#161b22;border-radius:8px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #21262d;font-size:14px}
  th{background:#1F3A5F}
  .REMEDIATED{color:#3fb950}.QUARANTINED{color:#f85149}.PROCESSING{color:#d29922}
</style>
</head>
<body>
<header><h1>SentinelOps - Compliance Dashboard</h1></header>
<main>
  <div class="bar">
    <input id="url" placeholder="https://<api-id>.execute-api.us-east-1.amazonaws.com/prod/report">
    <button onclick="load()">Load</button>
  </div>
  <p id="meta"></p>
  <table><thead><tr><th>Finding</th><th>Resource</th><th>Severity</th><th>Status</th><th>Action</th></tr></thead>
  <tbody id="rows"></tbody></table>
</main>
<script>
async function load(){
  const url=document.getElementById('url').value.trim(); if(!url) return;
  const r=await fetch(url); const d=await r.json();
  document.getElementById('meta').textContent=d.count+' findings';
  document.getElementById('rows').innerHTML=(d.findings||[]).map(f=>
    `<tr><td>${f.findingId||''}</td><td>${f.resourceId||''}</td><td>${f.severity||''}</td>`+
    `<td class="${f.status||''}">${f.status||''}</td><td>${f.remediationAction||''}</td></tr>`).join('');
}
</script>
</body>
</html>
